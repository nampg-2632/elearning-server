name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same PR/branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
      - run: yarn lint:check
      - run: yarn format:check
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build

  migrations:
    name: Migrations and seed
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Throwaway database that lives only for this job; not a real secret.
    # Each value is set once here and reused below through YAML anchors,
    # since service env cannot read the job's env context.
    services:
      postgres: &postgres-service
        image: postgres:16
        env:
          POSTGRES_USER: &pg_user elearning
          POSTGRES_PASSWORD: &pg_password elearning_ci
          POSTGRES_DB: &pg_database elearning
        ports:
          - 5432:5432
        # $POSTGRES_USER is expanded by the health check shell inside the container.
        options: >-
          --health-cmd "pg_isready -U $POSTGRES_USER"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # PG* are the standard libpq variables, read by psql and pg_dump.
    env:
      PGUSER: *pg_user
      PGPASSWORD: *pg_password
      PGDATABASE: *pg_database
    steps:
      # The job context is only available inside steps, not in job-level env.
      - name: Export database url and postgres container id
        run: |
          echo "DATABASE_URL=postgresql://$PGUSER:$PGPASSWORD@localhost:5432/$PGDATABASE" >> "$GITHUB_ENV"
          echo "PG_CONTAINER=${{ job.services.postgres.id }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      # Postgres tools run inside the service container so their version
      # always matches the server; `docker exec -e` passes PGUSER/PGDATABASE
      # through. Recent pg_dump wraps the dump in
      # \restrict/\unrestrict lines with a random token; drop them so two
      # dumps of the same schema compare equal.
      - name: Migrate
        run: |
          yarn db:migrate
          docker exec -e PGUSER -e PGDATABASE "$PG_CONTAINER" pg_dump --schema-only \
            | grep -vE '^\\(un)?restrict ' > schema-1.sql

      - name: Revert leaves an empty schema
        run: |
          yarn db:migrate:revert
          tables=$(docker exec -e PGUSER -e PGDATABASE "$PG_CONTAINER" psql -tAc \
            "SELECT string_agg(tablename, ', ') FROM pg_tables
             WHERE schemaname = 'public' AND tablename <> 'typeorm_migrations'")
          if [ -n "$tables" ]; then
            echo "::error::Tables left after revert: $tables"
            exit 1
          fi

      - name: Migrate again gives the same schema
        run: |
          yarn db:migrate
          docker exec -e PGUSER -e PGDATABASE "$PG_CONTAINER" pg_dump --schema-only \
            | grep -vE '^\\(un)?restrict ' > schema-2.sql
          diff -u schema-1.sql schema-2.sql

      - name: Seed twice without duplicating rows
        run: |
          count_rows() {
            docker exec -e PGUSER -e PGDATABASE "$PG_CONTAINER" psql -tAc \
              "SELECT tablename || ' ' || (xpath('/row/c/text()',
                 query_to_xml(format('SELECT count(*) AS c FROM %I', tablename), false, true, '')))[1]
               FROM pg_tables WHERE schemaname = 'public' ORDER BY tablename"
          }
          yarn db:seed
          count_rows > rows-1.txt
          yarn db:seed
          count_rows > rows-2.txt
          cat rows-1.txt
          diff -u rows-1.txt rows-2.txt

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Same throwaway Postgres as the migrations job.
    services:
      postgres: *postgres-service
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGUSER: *pg_user
      PGPASSWORD: *pg_password
      PGDATABASE: *pg_database
      IMAGE: elearning-server:ci
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image runs on the host network so localhost reaches the services.
      - name: Migrate with the image
        run: |
          export DATABASE_URL="postgresql://$PGUSER:$PGPASSWORD@localhost:5432/$PGDATABASE"
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
          docker run --rm --network host -e DATABASE_URL "$IMAGE" yarn db:migrate:prod

      - name: Start the app and wait until ready
        run: |
          docker run -d --name app --network host \
            -e DATABASE_URL -e REDIS_URL=redis://localhost:6379 \
            -e JWT_SECRET=ci-only-secret-not-used-anywhere-else \
            "$IMAGE"
          for _ in $(seq 1 30); do
            curl -sf http://localhost:3000/health/ready && exit 0
            sleep 2
          done
          echo "::error::App did not become ready"
          exit 1

      # Registering hashes a password, so this catches native modules
      # (argon2) that load but crash in the image.
      - name: Smoke test
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST http://localhost:3000/api/v1/auth/register \
            -H 'content-type: application/json' \
            -d '{"email":"smoke@elearning.local","password":"Smoke12345","fullName":"Smoke"}')
          if [ "$status" != 201 ]; then
            echo "::error::Register returned $status"
            exit 1
          fi

      - name: App logs
        if: always()
        run: docker logs app || true

  commitlint:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
      - run: >-
          yarn commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
