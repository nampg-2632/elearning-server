name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same PR/branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
      - run: yarn lint:check
      - run: yarn format:check
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build

  migrations:
    name: Migrations and seed
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: elearning
          POSTGRES_PASSWORD: elearning_ci
          POSTGRES_DB: elearning
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elearning"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://elearning:elearning_ci@localhost:5432/elearning
    steps:
      # The job context is only available inside steps, not in job-level env.
      - name: Export postgres container id
        run: echo "PG_CONTAINER=${{ job.services.postgres.id }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      # Postgres tools run inside the service container so their version
      # always matches the server. Recent pg_dump wraps the dump in
      # \restrict/\unrestrict lines with a random token; drop them so two
      # dumps of the same schema compare equal.
      - name: Migrate
        run: |
          yarn db:migrate
          docker exec "$PG_CONTAINER" pg_dump -U elearning --schema-only elearning \
            | grep -vE '^\\(un)?restrict ' > schema-1.sql

      - name: Revert leaves an empty schema
        run: |
          yarn db:migrate:revert
          tables=$(docker exec "$PG_CONTAINER" psql -U elearning -d elearning -tAc \
            "SELECT string_agg(tablename, ', ') FROM pg_tables
             WHERE schemaname = 'public' AND tablename <> 'typeorm_migrations'")
          if [ -n "$tables" ]; then
            echo "::error::Tables left after revert: $tables"
            exit 1
          fi

      - name: Migrate again gives the same schema
        run: |
          yarn db:migrate
          docker exec "$PG_CONTAINER" pg_dump -U elearning --schema-only elearning \
            | grep -vE '^\\(un)?restrict ' > schema-2.sql
          diff -u schema-1.sql schema-2.sql

      - name: Seed twice without duplicating rows
        run: |
          count_rows() {
            docker exec "$PG_CONTAINER" psql -U elearning -d elearning -tAc \
              "SELECT tablename || ' ' || (xpath('/row/c/text()',
                 query_to_xml(format('SELECT count(*) AS c FROM %I', tablename), false, true, '')))[1]
               FROM pg_tables WHERE schemaname = 'public' ORDER BY tablename"
          }
          yarn db:seed
          count_rows > rows-1.txt
          yarn db:seed
          count_rows > rows-2.txt
          cat rows-1.txt
          diff -u rows-1.txt rows-2.txt

  commitlint:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
      - run: >-
          yarn commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
