name: Release

# Every push to main is built, pushed to GHCR and deployed to the VPS. Run it
# by hand with a tag (e.g. sha-1a2b3c4) to redeploy or roll back to an image
# that is already in GHCR.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to deploy (empty = build the selected branch)
        required: false

# One release at a time; a newer push waits instead of cancelling a deploy.
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build and push image
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # provenance off: it adds an extra untagged manifest to every push.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Keep the 5 latest images
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 5

  deploy:
    name: Deploy to VPS
    needs: build
    # Also runs when build is skipped (manual run with a tag).
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: prod
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ inputs.tag || needs.build.outputs.tag }}
      APP_DIR: /opt/elearning
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
          EOF

      # Values live only in the prod environment (secrets, and variables for
      # what is not secret); the file is rebuilt on every deploy so changing
      # one only needs a re-run.
      - name: Write .env
        env:
          API_HOST: ${{ secrets.API_HOST }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
        run: |
          : "${POSTGRES_USER:?set the POSTGRES_USER variable of the prod environment}"
          : "${POSTGRES_DB:?set the POSTGRES_DB variable of the prod environment}"
          umask 077
          case $API_HOST in
            http://*) app_url=$API_HOST ;;
            *) app_url=https://$API_HOST ;;
          esac
          cat > deploy/.env <<EOF
          IMAGE_REPO=$IMAGE
          API_HOST=$API_HOST
          APP_URL=$app_url
          CORS_ORIGINS=$CORS_ORIGINS
          JWT_SECRET=$JWT_SECRET
          POSTGRES_USER=$POSTGRES_USER
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          POSTGRES_DB=$POSTGRES_DB
          EOF

      - name: Upload deploy files
        run: |
          scp -p deploy/docker-compose.prod.yml deploy/Caddyfile deploy/deploy.sh deploy/.env \
            "vps:$APP_DIR/"

      # The job token expires when the job ends; logging out afterwards keeps
      # it off the VPS anyway. Works whether the package is public or not.
      - name: Log in to GHCR on the VPS
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | ssh vps docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Deploy ${{ env.TAG }}
        run: |
          # Expanded here on purpose: the VPS gets the literal path and tag.
          # shellcheck disable=SC2029
          ssh vps "$APP_DIR/deploy.sh '$TAG'"

      - name: Log out of GHCR on the VPS
        if: always()
        run: ssh vps docker logout ghcr.io || true
