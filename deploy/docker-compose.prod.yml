# Production stack on the VPS, in /opt/elearning next to .env (written by the
# release workflow) and Caddyfile. Only Caddy publishes ports: Docker bypasses
# ufw, so Postgres and Redis must stay on the internal network.
name: elearning

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  app:
    image: ${IMAGE_REPO:?set IMAGE_REPO}:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY: 1
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 512m
    logging: *logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 768m
    logging: *logging

  # Holds auth state, so it is written to disk and survives restarts.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    logging: *logging

  # Direct mail mode only (COMPOSE_PROFILES=mta, set when MAIL_MODE=direct):
  # the app hands mail to this Postfix over the internal network, without
  # login or TLS, and Postfix signs it with DKIM and delivers it to the
  # recipient's MX on port 25. Needs outbound 25 open at the VPS provider,
  # a PTR record for MAIL_HOSTNAME, and SPF/DKIM/DMARC for MAIL_DOMAIN (see
  # README). Nothing is published: it only accepts mail from private networks.
  postfix:
    image: boky/postfix:v5.2.1
    profiles: [mta]
    restart: unless-stopped
    environment:
      ALLOWED_SENDER_DOMAINS: ${MAIL_DOMAIN:-}
      POSTFIX_myhostname: ${MAIL_HOSTNAME:-}
      DKIM_BACKEND: opendkim
      DKIM_AUTOGENERATE: 'true'
      DKIM_SELECTOR: mail
      # Internal network only; the app connects without STARTTLS.
      POSTFIX_smtpd_tls_security_level: none
    volumes:
      # The DKIM key published in DNS; losing it means publishing a new one.
      - postfix-dkim:/etc/opendkim/keys
      # Mail waiting for a retry survives restarts.
      - postfix-spool:/var/spool/postfix
    mem_limit: 128m
    logging: *logging

  # HTTPS termination; gets and renews the certificate for API_HOST itself.
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      API_HOST: ${API_HOST:?set API_HOST}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    mem_limit: 128m
    logging: *logging

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
  postfix-dkim:
  postfix-spool:
